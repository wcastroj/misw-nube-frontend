<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm border-0 text-center p-4">
        <div class="card-body">
          <div class="mb-3 text-warning">
            <i class="bi bi-shield-lock-fill display-3"></i>
          </div>
          <h3 class="card-title fw-bold text-dark mb-3">Acceso No Autorizado</h3>
          <p class="card-text text-muted mb-4">
            No dispones de los permisos requeridos para ingresar a esta sección.
          </p>
          <button type="button" class="btn btn-primary px-4 btn-return" (click)="returnToMain()">
            <i class="bi bi-arrow-left me-1"></i>
            Regresar a mi Panel Principal
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
